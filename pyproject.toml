[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satground-research"
version = "0.1.0"
description = "Reproducible laptop experiments for building structure in satellite-conditioned ground views"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "Pillow>=10", "scipy>=1.11", "PyYAML>=6", "scikit-learn>=1.3"]

[project.scripts]
satground = "satground.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
satground = ["editor_ui/*.html", "editor_ui/*.css", "editor_ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
